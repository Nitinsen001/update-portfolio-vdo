<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 1000" role="img" aria-labelledby="title description">
  <title id="title">AirAware air quality dashboard</title>
  <desc id="description">A portrait preview of the AirAware homepage with its forecast dashboard, features, and city forecast prompt.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a2e"/>
      <stop offset=".58" stop-color="#1d3455"/>
      <stop offset="1" stop-color="#10183d"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop stop-color="#38c6ff"/>
      <stop offset="1" stop-color="#0789c5"/>
    </radialGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0cb6e8" stop-opacity=".2"/>
      <stop offset="1" stop-color="#10183d" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#172554" flood-opacity=".1"/>
    </filter>
  </defs>

  <rect width="590" height="1000" fill="#f8fafc"/>

  <rect x="24" y="24" width="542" height="402" rx="24" fill="url(#hero)"/>
  <rect x="24" y="24" width="542" height="402" rx="24" fill="url(#glow)"/>
  <rect x="52" y="52" width="246" height="36" rx="18" fill="#16415a" stroke="#1f6882"/>
  <circle cx="70" cy="70" r="5" fill="#25bfea"/>
  <text x="86" y="75" fill="#a5e7fa" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">LIVE AQI INTELLIGENCE</text>

  <text x="52" y="157" fill="#f8fafc" font-family="Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-2">Air<tspan fill="#38bdf8">Aware</tspan></text>
  <text x="54" y="203" fill="#c3d0e1" font-family="Arial, sans-serif" font-size="17">AI-powered 10-day Air Quality forecasting</text>
  <text x="54" y="229" fill="#c3d0e1" font-family="Arial, sans-serif" font-size="17">using Facebook Prophet.</text>
  <text x="54" y="269" fill="#c3d0e1" font-family="Arial, sans-serif" font-size="17">Select a city, run the model, and get</text>
  <text x="54" y="295" fill="#c3d0e1" font-family="Arial, sans-serif" font-size="17">instant health insights.</text>

  <circle cx="465" cy="228" r="77" fill="#06a9e8" opacity=".12"/>
  <circle cx="465" cy="228" r="62" fill="url(#orb)"/>
  <text x="465" y="315" text-anchor="middle" fill="#b5d5ed" font-family="Arial, sans-serif" font-size="11" letter-spacing="1">AQI ORBS</text>

  <g font-family="Arial, sans-serif">
    <rect x="52" y="332" width="142" height="68" rx="12" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".15"/>
    <text x="68" y="361" fill="#38bdf8" font-size="23" font-weight="800">60+</text>
    <text x="68" y="384" fill="#c3d0e1" font-size="12">Indian Cities</text>

    <rect x="204" y="332" width="142" height="68" rx="12" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".15"/>
    <text x="220" y="361" fill="#38bdf8" font-size="23" font-weight="800">10</text>
    <text x="220" y="384" fill="#c3d0e1" font-size="12">Day Forecast</text>

    <rect x="356" y="332" width="182" height="68" rx="12" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".15"/>
    <text x="372" y="361" fill="#4ade80" font-size="23" font-weight="800">AI</text>
    <text x="372" y="384" fill="#c3d0e1" font-size="12">Prophet Model</text>
  </g>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="24" y="450" width="170" height="250" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
    <rect x="40" y="468" width="40" height="40" rx="12" fill="#2563eb"/>
    <text x="60" y="495" text-anchor="middle" fill="#ffffff" font-size="21">▥</text>
    <text x="40" y="537" fill="#172554" font-size="15" font-weight="700">Prophet AI Engine</text>
    <text x="40" y="565" fill="#52627a" font-size="12">Trained on years of</text>
    <text x="40" y="584" fill="#52627a" font-size="12">city-level daily AQI</text>
    <text x="40" y="603" fill="#52627a" font-size="12">records with yearly</text>
    <text x="40" y="622" fill="#52627a" font-size="12">and weekly seasonality.</text>

    <rect x="210" y="450" width="170" height="250" rx="16" fill="#f0fdf4" stroke="#bbf7d0"/>
    <rect x="226" y="468" width="40" height="40" rx="12" fill="#16a34a"/>
    <text x="246" y="495" text-anchor="middle" fill="#ffffff" font-size="21">+</text>
    <text x="226" y="537" fill="#14532d" font-size="15" font-weight="700">Health Advisories</text>
    <text x="226" y="565" fill="#52627a" font-size="12">Real health guidance</text>
    <text x="226" y="584" fill="#52627a" font-size="12">for every AQI category,</text>
    <text x="226" y="603" fill="#52627a" font-size="12">from outdoor safety to</text>
    <text x="226" y="622" fill="#52627a" font-size="12">emergency protocols.</text>

    <rect x="396" y="450" width="170" height="250" rx="16" fill="#faf5ff" stroke="#e9d5ff"/>
    <rect x="412" y="468" width="40" height="40" rx="12" fill="#9333ea"/>
    <text x="432" y="495" text-anchor="middle" fill="#ffffff" font-size="21">⌂</text>
    <text x="412" y="537" fill="#581c87" font-size="15" font-weight="700">60+ Indian Cities</text>
    <text x="412" y="565" fill="#52627a" font-size="12">Historical AQI data</text>
    <text x="412" y="584" fill="#52627a" font-size="12">for major cities with</text>
    <text x="412" y="603" fill="#52627a" font-size="12">outlier-filtered time</text>
    <text x="412" y="622" fill="#52627a" font-size="12">series.</text>
  </g>

  <rect x="24" y="726" width="542" height="222" rx="18" fill="#f1f5f9" stroke="#e2e8f0"/>
  <circle cx="295" cy="777" r="24" fill="#e2e8f0"/>
  <text x="295" y="786" text-anchor="middle" font-family="Arial, sans-serif" font-size="23">👈</text>
  <text x="295" y="835" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif" font-size="19" font-weight="700">Choose a City · Click Forecast</text>
  <text x="295" y="868" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="13">Select any city and run the AI forecast.</text>
  <rect x="193" y="889" width="204" height="38" rx="19" fill="#0f172a"/>
  <text x="295" y="914" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700">Forecast AQI</text>

  <text x="295" y="978" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" letter-spacing="1.1">AIR QUALITY INTELLIGENCE</text>
</svg>
